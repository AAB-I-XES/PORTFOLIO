<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Page Not Found — Dibyajyoti Rabha</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #ededed;
        color: #111111;
        font-family: Arial, Helvetica, sans-serif;
      }
      .card {
        max-width: 640px;
        padding: 2.5rem;
        border: 1px solid rgba(17,17,17,0.12);
        background: rgba(255,255,255,0.4);
        border-radius: 24px;
        text-align: center;
      }
      h1 { font-size: clamp(2rem, 7vw, 4rem); margin: 0 0 1rem; }
      p { margin: 0 0 1.5rem; font-size: 1.05rem; line-height: 1.7; }
      .actions { display: flex; justify-content: center; gap: 1rem; flex-wrap: wrap; }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 0.8rem 1.25rem;
        border-radius: 999px;
        border: 1px solid rgba(17,17,17,0.18);
        color: inherit;
        text-decoration: none;
      }
      a.primary { background: #111111; color: #f5f2eb; }
    </style>
  </head>
  <body>
    <main class="card">
      <p style="font-size: 0.75rem; letter-spacing: 0.2em; text-transform: uppercase; opacity: 0.7;">404 error</p>
      <h1>Page Not Found</h1>
      <p>The page you requested is missing, moved, or no longer exists. You can return to the portfolio or explore recent work.</p>
      <div class="actions">
        <a class="primary" href="/">Return Home</a>
        <a href="/#projects">View Projects</a>
        <a href="mailto:rabhadibyajyoti05@gmail.com">Contact</a>
      </div>
    </main>
  </body>
</html>
